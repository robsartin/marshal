name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & verify (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v6

      # The full ADR-mandated gate: Spotless format check, tests with -ea,
      # JaCoCo coverage verification (line > 80% / branch > 65%), and ArchUnit.
      - name: Build & verify
        run: ./gradlew --no-daemon clean check

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          if-no-files-found: ignore
